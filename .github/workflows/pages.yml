# The cloud agent's GitHub token cannot call the Pages API (403).
# This workflow uses the repository GITHUB_TOKEN, which has pages: write,
# to enable branch Pages from main (/). If that is rejected, it falls
# back to a GitHub Actions Pages deployment.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable branch Pages
        id: branch_pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo="${{ github.repository }}"
          body='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          post_code=$(curl -sS -o /tmp/pages-post.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/pages" \
            -d "$body")
          echo "POST /pages -> ${post_code}"
          cat /tmp/pages-post.json
          echo
          if [ "$post_code" = "201" ] || [ "$post_code" = "409" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          put_code=$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/pages" \
            -d "$body")
          echo "PUT /pages -> ${put_code}"
          cat /tmp/pages-put.json
          echo
          if [ "$put_code" = "200" ] || [ "$put_code" = "201" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Branch Pages was not enabled"
          exit 1

      - name: Setup Pages
        if: steps.branch_pages.outputs.enabled != 'true'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        if: steps.branch_pages.outputs.enabled != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.branch_pages.outputs.enabled != 'true'
        uses: actions/deploy-pages@v5
